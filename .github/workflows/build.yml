name: Build Osaid File (Flutter Android & iOS)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    name: بناء نسخة الأندرويد (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: تنزيل ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: تهيئة مجلدات Flutter الرسمية
        run: flutter create . --project-name osaid_file --org com.osaid.file

      - name: تثبيت الحزم
        run: flutter pub get

      - name: بناء تطبيق الأندرويد APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: تجهيز ملف APK النهائي
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/OsaidFile-Android.apk
          ls -lh dist/OsaidFile-Android.apk

      - name: رفع ملف APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: OsaidFile-Android-APK
          path: dist/OsaidFile-Android.apk
          retention-days: 30

  build-ios:
    name: بناء نسخة الآيفون والآيباد (iOS/iPadOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: تنزيل ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: تهيئة مجلدات Flutter الرسمية
        run: flutter create . --project-name osaid_file --org com.osaid.file

      - name: تثبيت الحزم
        run: flutter pub get

      - name: بناء تطبيق iOS/iPadOS بدون توقيع
        run: flutter build ios --release --no-codesign --no-tree-shake-icons
