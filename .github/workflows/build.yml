name: Build Osaid File (Flutter Android APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    name: بناء نسخة الأندرويد (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: تنزيل ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: تهيئة مشروع Flutter نظيف ودمج محرك أسيد والصلاحيات
        run: |
          rm -rf android ios
          flutter create . --project-name osaid_file --org com.osaid.file
          cp android_bridge/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/osaid/file
          cp android_bridge/MainActivity.kt android/app/src/main/kotlin/com/osaid/file/MainActivity.kt
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
            sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
            cat << 'EOF' >> android/app/build.gradle.kts

          dependencies {
              val ytDlVersion = "0.18.1"
              implementation("io.github.junkfood02.youtubedl-android:library:$ytDlVersion")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:$ytDlVersion")
              implementation("io.github.junkfood02.youtubedl-android:aria2c:$ytDlVersion")
          }
          EOF
          else
            cat << 'EOF' >> android/app/build.gradle

          dependencies {
              def ytDlVersion = "0.18.1"
              implementation "io.github.junkfood02.youtubedl-android:library:$ytDlVersion"
              implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$ytDlVersion"
              implementation "io.github.junkfood02.youtubedl-android:aria2c:$ytDlVersion"
          }
          EOF
          fi

      - name: تثبيت الحزم
        run: flutter pub get

      - name: بناء تطبيق الأندرويد APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: تجهيز ملف APK النهائي
        run: |
          mkdir -p dist
          cp build/app/outputs/apk/release/app-release.apk dist/OsaidFile-Android.apk
          ls -lh dist/OsaidFile-Android.apk

      - name: رفع ملف APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: OsaidFile-Android-APK
          path: dist/OsaidFile-Android.apk
          retention-days: 30
